<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05070a">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Directory unavailable // Veydran Interstellar Authority</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <style>
    :root{--cyan:#59dcff;--text:#e8f8fb;--muted:#78959e;--line:rgba(84,213,242,.18)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#030609;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,rgba(36,161,201,.08),transparent 35%),linear-gradient(#020507,#06090c)}
    .panel{width:min(680px,calc(100% - 32px));border:1px solid var(--line);background:rgba(5,17,23,.9);padding:32px}
    .code{font-size:9px;letter-spacing:2px;color:var(--cyan);margin-bottom:14px}
    h1{margin:0 0 16px;font-size:clamp(34px,7vw,64px);line-height:.95;letter-spacing:-2px}
    p{margin:0 0 24px;color:#91aab2;line-height:1.65}
    a{display:inline-block;border:1px solid rgba(89,220,255,.35);background:#06202a;color:var(--text);padding:12px 16px;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:1.4px}
    a:hover{border-color:var(--cyan)}
    .fine{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:8px;letter-spacing:1.4px;color:#536e76}
  </style>
</head>
<body>
  <main class="panel">
    <div class="code">VEYDRAN PUBLIC DIRECTORY // ROUTE RESPONSE</div>
    <h1>Directory unavailable.</h1>
    <p>The requested record is not present in the public services index.</p>
    <a href="/">RETURN TO PUBLIC NODE</a>
    <div class="fine">TERRAN ACCESS // NO FURTHER INFORMATION AVAILABLE</div>
  </main>
</body>
</html>
